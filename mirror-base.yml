# Repo-wide policy for the Amazon-published toolchains mirrored here.
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns (name, target, source, assets, asset_type,
# bin_scan, metadata, catalog, tests, versions, announce, annotations) stays in
# that package's own file.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge. `platforms:`
# is where this bites: it carries BOTH the runner matrix and the container
# legs, so a child that restates it to tweak one runner silently drops every
# `containers:` entry. Nothing reds — the legs simply stop existing, and every
# os.features claim in that spec goes back to being merely asserted. Restate
# `platforms:` IN FULL or not at all.

skip_prereleases: true
cascade: true

# The fleet rule is `build_timestamp: date`; `none` here is the pre-existing
# choice of the mirror this repo grew out of, kept deliberately. Corretto's OCX
# version already encodes the upstream build (`21.0.12_8001` folds jdkBuild and
# the Corretto revision into the patch segment), so upstream never re-releases a
# version tag and the bare tag is written once. Only the rolling cascade aliases
# move, which is inherent to cascading and true under `date` too. Switching to
# `date` would also re-tag every already-published version for no gain.
build_timestamp: none

# No `verify:` block. `github_asset_digest` is a github_release-source option
# and every package here is `url_index`; upstream ships detached GPG `.sig`
# sidecars rather than a checksum manifest, so there is no `checksums_file` to
# wire either. Downloads are HTTPS from the corretto.aws CDN.

concurrency:
  # JDK archives are 180–350 MB and each bundle re-compresses the whole tree —
  # an order of magnitude larger than a single-binary CLI mirror, so these
  # limits stay low. Proven against this exact upstream.
  max_downloads: 4
  max_bundles: 2
  max_pushes: 2
  rate_limit_ms: 200
  max_retries: 3
  compression_threads: 0

# ─── Platform matrix ────────────────────────────────────────────────────────
#
# Shared because Amazon publishes the same shape for every JDK major: a
# glibc-linked Linux build and a SEPARATE musl-linked Alpine build per arch.
# The per-package libc measurement (file/readelf on the real `bin/java`) is
# recorded above each spec's `assets:` block.
#
# ⚠️ `os.features` states what the artifact REQUIRES OF THE HOST, not how it
# was built. Neither Linux build here is static — each carries a PT_INTERP
# naming its own loader — so neither covers the other and BOTH keys carry an
# explicit libc feature:
#
#   - the linux build needs /lib64/ld-linux-*.so → `+libc.glibc`
#   - the alpine build needs /lib/ld-musl-*.so.1 → `+libc.musl`
#
# (A bare key would be correct only for a FULLY STATIC build with no
# PT_INTERP — that is the astral-sh Rust-CLI case, not this one.)
#
# Container legs follow from what each key CLAIMS, and are the only mechanism
# that turns a claim into evidence:
#   - `+libc.glibc` → ubuntu + fedora, NO alpine. The glibc build cannot load
#     under musl, so an alpine leg would red on a correct artifact.
#   - `+libc.musl`  → alpine only. Same reasoning mirrored: the musl build
#     cannot load under glibc.
platforms:
  "linux/amd64+libc.glibc":
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "fedora:40",    shell: bash }
  "linux/amd64+libc.musl":
    runner: ubuntu-latest
    containers:
      - { image: "alpine:3.20", shell: sh }
  "linux/arm64+libc.glibc":
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer's guard reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "fedora:40",    shell: bash }
  "linux/arm64+libc.musl":
    runner: ubuntu-24.04-arm
    containers:
      - { image: "alpine:3.20", shell: sh }
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 (GitHub's
    # macos-13 Intel pool is exhausted and deadlocks the push job).
    runner: macos-14
    prefix: ["arch", "-x86_64"]
  darwin/arm64:
    runner: macos-14
    shell: bash
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.
  #
  # No `windows/arm64`: upstream ships windows-x64 and (JDK 8 only) windows-x86
  # and nothing else. There is no aarch64 Windows Corretto tarball to mirror.

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
