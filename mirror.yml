name: corretto
target:
  registry: ocx.sh
  repository: corretto

# Corretto ships no GitHub release assets — download URLs live in the
# release-notes body on the corretto.aws CDN. generate.py scrapes them and
# emits a url_index covering ALL mirrored JDK majors (8, 11, 17, 21, 25).
# Per-major patch floors live in generate.py (MAJOR_FLOORS).
source:
  type: url_index
  generator:
    command: ["uv", "run", "generate.py"]
    timeout_seconds: 240

# Asset names are anchored ^…$ to exclude the .sig sidecars and the
# alpine/musl, jre, deb/rpm/pkg/msi artifacts that share the version prefix.
assets:
  linux/amd64:
    - "^amazon-corretto-.*-linux-x64\\.tar\\.gz$"
  linux/arm64:
    - "^amazon-corretto-.*-linux-aarch64\\.tar\\.gz$"
  darwin/amd64:
    - "^amazon-corretto-.*-macosx-x64\\.tar\\.gz$"
  darwin/arm64:
    - "^amazon-corretto-.*-macosx-aarch64\\.tar\\.gz$"
  windows/amd64:
    - "^amazon-corretto-.*-windows-x64-jdk\\.zip$"

asset_type:
  type: archive
  strip_components: 1

metadata:
  default: metadata.json
  platforms:
    # macOS Corretto tarballs nest the JDK under Contents/Home — bin lives at
    # ${installPath}/Contents/Home/bin (see metadata-darwin.json).
    darwin/amd64: metadata-darwin.json
    darwin/arm64: metadata-darwin.json

skip_prereleases: true
cascade: true
build_timestamp: none

# Single wide range spans every JDK major (8.x – 25.x). Per-major patch
# floors are enforced in generate.py so historical patches do not bootstrap
# into the mirror on first run. Bump max when a new JDK major ships.
versions:
  min: "8.0.0"
  max: "26"
  new_per_run: 10
  poll_interval: "0 */6 * * *"

concurrency:
  max_downloads: 4
  max_bundles: 2
  max_pushes: 2
  rate_limit_ms: 200
  max_retries: 3
  compression_threads: 0

tests:
  - name: smoke
    script: tests/smoke.star

platforms:
  linux/amd64:
    runner: ubuntu-latest
  linux/arm64:
    runner: ubuntu-24.04-arm
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 (GitHub's
    # macos-13 Intel pool is exhausted and deadlocks the push job).
    runner: macos-14
  darwin/arm64:
    runner: macos-14
    shell: bash
  windows/amd64:
    runner: windows-latest
    shell: pwsh

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
